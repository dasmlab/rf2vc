<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rf2vc · DASMLAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="page">
    <header class="hero-strip rise">
      <div class="hero-noise" aria-hidden="true"></div>
      <div class="hero-orb a" aria-hidden="true"></div>
      <div class="hero-orb b" aria-hidden="true"></div>
      <div class="hero-content">
        <p class="caps">DASMLAB · tools</p>
        <h1 class="brand">rf2vc</h1>
        <p class="headline">Redfish to vSphere.</p>
        <p class="lede">Configure vCenters, bind BIOS UUIDs, and route BMH <code>/redfish/v1/Systems/&lt;uuid&gt;</code>.</p>
        <div class="cta-row">
          <button type="button" class="pill primary" id="btnAddVC">Add vCenter</button>
          <span class="status-chip" id="statusLine">loading…</span>
        </div>
      </div>
    </header>

    <section class="workspace rise" style="--d:80ms">
      <aside class="shell vc-pane">
        <div class="pane-head">
          <div>
            <p class="caps">Inventory</p>
            <h2 class="pane-title">vCenters</h2>
          </div>
          <button type="button" class="pill ghost sm" id="btnAddVC2">Add</button>
        </div>
        <div id="vcList" class="vc-list"></div>
      </aside>

      <main class="shell detail-pane" id="detailPane">
        <div id="detailBody">
          <div class="empty-state">
            <div class="ph-icon" aria-hidden="true"></div>
            <p class="empty-title">Select a vCenter</p>
            <p>Pick one on the left to see its UUIDs, edit connection settings, or bind a new system.</p>
          </div>
        </div>
      </main>
    </section>
  </div>

  <template id="tplVCForm">
    <form class="vc-form" id="vcForm">
      <input type="hidden" name="id" />
      <label>Name <input name="name" required placeholder="lab-vc" /></label>
      <label>URL <input name="url" required placeholder="https://vcenter.example.local" /></label>
      <label>Username <input name="username" required placeholder="administrator@vsphere.local" /></label>
      <label>Password <input name="password" type="password" placeholder="required for new / leave blank to keep" autocomplete="new-password" /></label>
      <div class="row2">
        <label>Datacenter <input name="datacenter" required /></label>
        <label>Datastore <input name="datastore" required /></label>
      </div>
      <label>ISO folder <input name="isoFolder" placeholder="rf2vc/isos" /></label>
      <label class="check"><input type="checkbox" name="insecure" /> Insecure TLS (GOVC_INSECURE)</label>
      <label>Notes <input name="notes" /></label>
      <div class="actions">
        <button type="submit" class="pill primary">Save</button>
        <button type="button" class="pill ghost" data-action="test">Test</button>
        <button type="button" class="pill ghost" data-action="cancel">Cancel</button>
      </div>
      <p class="msg" data-msg="vc"></p>
    </form>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
