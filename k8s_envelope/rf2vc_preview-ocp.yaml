apiVersion: v1
kind: Namespace
metadata:
  name: __PREVIEW_NS__
  labels:
    app.kubernetes.io/name: rf2vc
    app.kubernetes.io/component: preview
    rf2vc.dasmlab.org/preview-owner: "__PREVIEW_OWNER__"
    pod-security.kubernetes.io/enforce: baseline

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rf2vc-sa
  namespace: __PREVIEW_NS__
imagePullSecrets:
  - name: dasmlab-ghcr-pull

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller
  namespace: __PREVIEW_NS__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: __PREVIEW_NS__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: rf2vc-sa
    namespace: __PREVIEW_NS__

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf2vc
  namespace: __PREVIEW_NS__
  labels:
    app: rf2vc
    rf2vc.dasmlab.org/preview-owner: "__PREVIEW_OWNER__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rf2vc
  template:
    metadata:
      labels:
        app: rf2vc
    spec:
      serviceAccountName: rf2vc-sa
      securityContext:
        fsGroup: 65532
      imagePullSecrets:
        - name: dasmlab-ghcr-pull
      containers:
        - name: rf2vc
          image: ghcr.io/dasmlab/rf2vc:__VERSION__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          args:
            - -config
            - /etc/rf2vc/gateway.yaml
          env:
            - name: RF2VC_LISTEN
              value: ":8080"
            - name: BUILD_VERSION
              value: "__VERSION__"
            - name: RF2VC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-username
            - name: RF2VC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-password
            - name: RF2VC_VSPHERE_URL
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: vsphere-url
            - name: RF2VC_VSPHERE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: vsphere-username
            - name: RF2VC_VSPHERE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: vsphere-password
            - name: RF2VC_VSPHERE_DATACENTER
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: vsphere-datacenter
            - name: RF2VC_VSPHERE_DATASTORE
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: vsphere-datastore
          volumeMounts:
            - name: config
              mountPath: /etc/rf2vc
              readOnly: true
            - name: iso-cache
              mountPath: /var/tmp/rf2vc
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: rf2vc-gateway-config
        - name: iso-cache
          emptyDir:
            sizeLimit: 8Gi

---
apiVersion: v1
kind: Service
metadata:
  name: rf2vc
  namespace: __PREVIEW_NS__
spec:
  selector:
    app: rf2vc
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rf2vc
  namespace: __PREVIEW_NS__
  labels:
    app: rf2vc
spec:
  host: __PREVIEW_HOST__
  to:
    kind: Service
    name: rf2vc
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
