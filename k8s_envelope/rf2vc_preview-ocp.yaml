apiVersion: v1
kind: Namespace
metadata:
  name: __PREVIEW_NS__
  labels:
    app.kubernetes.io/name: rf2vc
    app.kubernetes.io/component: preview
    rf2vc.dasmlab.org/preview-owner: "__PREVIEW_OWNER__"
    pod-security.kubernetes.io/enforce: baseline

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rf2vc-sa
  namespace: __PREVIEW_NS__
  annotations:
    # lets oauth-proxy use this SA as the OAuth client for the rf2vc Route
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"rf2vc"}}'

---
# Dashboard access = this Role. oauth-proxy checks it with --openshift-sar;
# add or remove IdP groups in the RoleBinding below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rf2vc-ui-access
  namespace: __PREVIEW_NS__
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["rf2vc"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rf2vc-ui-access
  namespace: __PREVIEW_NS__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rf2vc-ui-access
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tdm-chips-admin

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller
  namespace: __PREVIEW_NS__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: __PREVIEW_NS__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: rf2vc-sa
    namespace: __PREVIEW_NS__

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rf2vc-data
  namespace: __PREVIEW_NS__
  labels:
    app: rf2vc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: __STORAGE_CLASS__
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rf2vc-gateway-config
  namespace: __PREVIEW_NS__
  labels:
    app: rf2vc
data:
  gateway.yaml: |
    listen: ":8080"
    auth:
      username: "redfish"
      password: "OVERRIDDEN_BY_SECRET"
    dataDir: "/data"
    isoCacheDir: "/data/iso-cache"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf2vc
  namespace: __PREVIEW_NS__
  labels:
    app: rf2vc
    rf2vc.dasmlab.org/preview-owner: "__PREVIEW_OWNER__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rf2vc
  template:
    metadata:
      labels:
        app: rf2vc
    spec:
      serviceAccountName: rf2vc-sa
      securityContext:
        fsGroup: 65532
      initContainers:
        # break-glass: bcrypt htpasswd from the rf2vc-gateway Secret for oauth-proxy's login form
        - name: htpasswd
          image: ghcr.io/dasmlab/rf2vc:__VERSION__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          args: ["-write-htpasswd", "/htpasswd/users"]
          env:
            - name: RF2VC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-username
            - name: RF2VC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-password
          volumeMounts:
            - name: htpasswd
              mountPath: /htpasswd
      containers:
        - name: rf2vc
          image: ghcr.io/dasmlab/rf2vc:__VERSION__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          args:
            - -config
            - /etc/rf2vc/gateway.yaml
          env:
            - name: RF2VC_LISTEN
              value: ":8080"
            # dashboard + /api only on loopback, reachable through oauth-proxy
            - name: RF2VC_UI_LISTEN
              value: "127.0.0.1:8081"
            - name: RF2VC_DATA_DIR
              value: "/data"
            - name: BUILD_VERSION
              value: "__VERSION__"
            - name: RF2VC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-username
            - name: RF2VC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-password
          volumeMounts:
            - name: config
              mountPath: /etc/rf2vc
              readOnly: true
            - name: data
              mountPath: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.20
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          args:
            - --provider=openshift
            - --https-address=:8443
            - --http-address=
            - --upstream=http://127.0.0.1:8081
            - --openshift-service-account=rf2vc-sa
            - '--openshift-sar={"namespace":"__PREVIEW_NS__","resource":"services","resourceName":"rf2vc","verb":"get"}'
            - --htpasswd-file=/etc/proxy/htpasswd/users
            - --pass-user-headers=true
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/tls/private/tls.key
            - --cookie-secure=true
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: htpasswd
              mountPath: /etc/proxy/htpasswd
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rf2vc-gateway-config
        - name: data
          persistentVolumeClaim:
            claimName: rf2vc-data
        - name: proxy-tls
          secret:
            secretName: rf2vc-tls
        - name: htpasswd
          emptyDir:
            medium: Memory

---
apiVersion: v1
kind: Service
metadata:
  name: rf2vc
  namespace: __PREVIEW_NS__
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: rf2vc-tls
spec:
  selector:
    app: rf2vc
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rf2vc
  namespace: __PREVIEW_NS__
  labels:
    app: rf2vc
spec:
  host: __PREVIEW_HOST__
  to:
    kind: Service
    name: rf2vc
    weight: 100
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

---
# Same host, /redfish straight to the gateway (Basic Auth) for Ironic/BMH.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rf2vc-redfish
  namespace: __PREVIEW_NS__
  labels:
    app: rf2vc
spec:
  host: __PREVIEW_HOST__
  path: /redfish
  to:
    kind: Service
    name: rf2vc
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
