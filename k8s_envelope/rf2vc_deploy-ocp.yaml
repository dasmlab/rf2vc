apiVersion: v1
kind: Namespace
metadata:
  name: rf2vc-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rf2vc-sa
  namespace: rf2vc-system
  annotations:
    # lets oauth-proxy use this SA as the OAuth client for the rf2vc Route
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"rf2vc"}}'

---
# Access = this Role. oauth-proxy checks it for dashboard users (--openshift-sar)
# and the gateway checks it for /api bearer tokens (:8444). Grant people via
# IdP groups in rf2vc-ui-access, systems via ServiceAccounts in rf2vc-api-clients.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rf2vc-ui-access
  namespace: rf2vc-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["rf2vc"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rf2vc-ui-access
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rf2vc-ui-access
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tdm-chips-admin

---
# System caller for /api: https://rf2vc.rf2vc-system.svc:8444 with this SA's token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rf2vc-api-client
  namespace: rf2vc-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rf2vc-api-clients
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rf2vc-ui-access
subjects:
  - kind: ServiceAccount
    name: rf2vc-api-client
    namespace: rf2vc-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: rf2vc-sa
    namespace: rf2vc-system

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rf2vc-data
  namespace: rf2vc-system
  labels:
    app: rf2vc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvms-vg1
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rf2vc-gateway-config
  namespace: rf2vc-system
  labels:
    app: rf2vc
data:
  gateway.yaml: |
    listen: ":8080"
    tlsCertFile: ""
    tlsKeyFile: ""
    auth:
      username: "redfish"
      password: "OVERRIDDEN_BY_SECRET"
    dataDir: "/data"
    isoCacheDir: "/data/iso-cache"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf2vc
  namespace: rf2vc-system
  labels:
    app: rf2vc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rf2vc
  template:
    metadata:
      labels:
        app: rf2vc
    spec:
      serviceAccountName: rf2vc-sa
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # break-glass: bcrypt htpasswd from the rf2vc-gateway Secret for oauth-proxy's login form
        - name: htpasswd
          image: ghcr.io/dasmlab/rf2vc:__VERSION__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          args: ["-write-htpasswd", "/htpasswd/users"]
          env:
            - name: RF2VC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-username
            - name: RF2VC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-password
          volumeMounts:
            - name: htpasswd
              mountPath: /htpasswd
      containers:
        - name: rf2vc
          image: ghcr.io/dasmlab/rf2vc:__VERSION__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          args:
            - -config
            - /etc/rf2vc/gateway.yaml
          env:
            - name: RF2VC_LISTEN
              value: ":8080"
            # dashboard + /api only on loopback, reachable through oauth-proxy
            - name: RF2VC_UI_LISTEN
              value: "127.0.0.1:8081"
            # /api for systems: Kubernetes bearer tokens, TLS via service-ca
            - name: RF2VC_API_LISTEN
              value: ":8444"
            - name: RF2VC_API_TLS_CERT
              value: /etc/tls/private/tls.crt
            - name: RF2VC_API_TLS_KEY
              value: /etc/tls/private/tls.key
            # per-BMH Redfish credentials (optional Secret rf2vc-redfish-clients)
            - name: RF2VC_REDFISH_CLIENTS_DIR
              value: /etc/rf2vc-redfish-clients
            # "true" once every BMH uses its own credential
            - name: RF2VC_REDFISH_DISABLE_SHARED
              value: "false"
            - name: RF2VC_DATA_DIR
              value: "/data"
            - name: BUILD_VERSION
              value: "__VERSION__"
            - name: RF2VC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-username
            - name: RF2VC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rf2vc-gateway
                  key: auth-password
          volumeMounts:
            - name: config
              mountPath: /etc/rf2vc
              readOnly: true
            - name: data
              mountPath: /data
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: redfish-clients
              mountPath: /etc/rf2vc-redfish-clients
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: api
              containerPort: 8444
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.20
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          args:
            - --provider=openshift
            - --https-address=:8443
            - --http-address=
            - --upstream=http://127.0.0.1:8081
            - --openshift-service-account=rf2vc-sa
            - '--openshift-sar={"namespace":"rf2vc-system","resource":"services","resourceName":"rf2vc","verb":"get"}'
            - --htpasswd-file=/etc/proxy/htpasswd/users
            - --pass-user-headers=true
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/tls/private/tls.key
            - --cookie-secure=true
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: htpasswd
              mountPath: /etc/proxy/htpasswd
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rf2vc-gateway-config
        - name: data
          persistentVolumeClaim:
            claimName: rf2vc-data
        - name: proxy-tls
          secret:
            secretName: rf2vc-tls
        - name: htpasswd
          emptyDir:
            medium: Memory
        # one key per BMH: key = Redfish username, value = password
        - name: redfish-clients
          secret:
            secretName: rf2vc-redfish-clients
            optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: rf2vc
  namespace: rf2vc-system
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: rf2vc-tls
  labels:
    app: rf2vc
spec:
  selector:
    app: rf2vc
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
    - name: api
      port: 8444
      targetPort: api
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rf2vc
  namespace: rf2vc-system
  labels:
    app: rf2vc
spec:
  host: rf2vc.apps.2026-prod-1.ocp.dasmlab.org
  to:
    kind: Service
    name: rf2vc
    weight: 100
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

---
# Same host, /redfish straight to the gateway (Basic Auth) for Ironic/BMH.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rf2vc-redfish
  namespace: rf2vc-system
  labels:
    app: rf2vc
spec:
  host: rf2vc.apps.2026-prod-1.ocp.dasmlab.org
  path: /redfish
  to:
    kind: Service
    name: rf2vc
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
