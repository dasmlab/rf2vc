name: Render D2 Diagrams

on:
  push:
    paths:
      - "**/*.d2"
      - ".github/workflows/d2-diagrams.yml"
  workflow_dispatch:

jobs:
  render-d2:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install D2 CLI
        run: |
          set -euo pipefail
          curl -fsSL https://d2lang.com/install.sh | sh -s --
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render all D2 files to sibling SVG files
        run: |
          set -euo pipefail

          mapfile -t d2_files < <(git ls-files "*.d2")
          if [ "${#d2_files[@]}" -eq 0 ]; then
            echo "No .d2 files found."
            exit 0
          fi

          for src in "${d2_files[@]}"; do
            out="${src%.d2}.svg"
            echo "Rendering ${src} -> ${out}"
            d2 "${src}" "${out}"
          done

      - name: Commit and push updated SVG files
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          if git diff --quiet -- "*.svg"; then
            echo "No SVG updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "*.svg"
          git commit -m "chore(diagrams): auto-render D2 SVG outputs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
