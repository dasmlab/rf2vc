name: rf2vc CX Pipeline

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump on main (point every commit; minor/major when drawing a line)"
        required: false
        default: "point"
        type: choice
        options: [point, minor, major]

env:
  RUNNER_LABEL: self-hosted

concurrency:
  group: rf2vc-${{ github.ref == 'refs/heads/main' && 'prod' || format('preview-{0}', github.actor) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare:
    runs-on: [self-hosted]
    permissions:
      contents: write
    outputs:
      version_tag: ${{ steps.claim.outputs.version_tag || steps.meta.outputs.version_tag }}
      semver: ${{ steps.claim.outputs.semver || steps.meta.outputs.semver }}
      git_tag: ${{ steps.claim.outputs.git_tag || steps.meta.outputs.git_tag }}
      is_prod: ${{ steps.meta.outputs.is_prod }}
      create_git_tag: ${{ steps.meta.outputs.create_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          set -euo pipefail
          chmod +x scripts/ci/resolve-version.sh

          # Skip bot-only .localbuild bumps (avoid loops).
          if git log -1 --pretty=%B | grep -qi '\[skip ci\]'; then
            echo "Skipping: commit marked [skip ci]"
            echo "version_tag=skip" >> "$GITHUB_OUTPUT"
            echo "semver=skip" >> "$GITHUB_OUTPUT"
            echo "git_tag=skip" >> "$GITHUB_OUTPUT"
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
            echo "create_git_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Explicit release tag (commitme / line in the sand).
            SHA="$(git rev-parse --short HEAD)"
            RAW="${GITHUB_REF_NAME#v}"
            # Only plain vX.Y.Z (ignore accidental vX.Y.Z-sha tags)
            if ! echo "${RAW}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Ignoring non-semver tag ${GITHUB_REF_NAME}"
              echo "version_tag=skip" >> "$GITHUB_OUTPUT"
              echo "semver=skip" >> "$GITHUB_OUTPUT"
              echo "git_tag=skip" >> "$GITHUB_OUTPUT"
              echo "is_prod=false" >> "$GITHUB_OUTPUT"
              echo "create_git_tag=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "version_tag=v${RAW}-${SHA}" >> "$GITHUB_OUTPUT"
            echo "semver=${RAW}" >> "$GITHUB_OUTPUT"
            echo "git_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
            echo "create_git_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IS_PROD=false
          BUMP=0
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            IS_PROD=true
            BUMP=1
          fi

          BUMP_KIND="${{ github.event.inputs.bump || 'point' }}"
          BUMP="${BUMP}" BUMP_KIND="${BUMP_KIND}" SHA="$(git rev-parse --short HEAD)" \
            ./scripts/ci/resolve-version.sh

          echo "is_prod=${IS_PROD}" >> "$GITHUB_OUTPUT"
          # create_git_tag already set by resolve-version when bumping; force false off main
          if [ "${IS_PROD}" != "true" ]; then
            echo "create_git_tag=false" >> "$GITHUB_OUTPUT"
          fi

      # Claim SemVer via git tag only (no .localbuild commit on main — that raced).
      - name: Claim SemVer tag
        id: claim
        if: steps.meta.outputs.is_prod == 'true' && steps.meta.outputs.create_git_tag == 'true' && steps.meta.outputs.version_tag != 'skip'
        env:
          BUMP_KIND: ${{ github.event.inputs.bump || 'point' }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/resolve-version.sh
          SHA="$(git rev-parse --short HEAD)"

          claimed=""
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --tags origin
            # Drop any local tag that isn't on origin yet from a failed prior attempt.
            # Re-resolve against latest remote tags each attempt.
            rm -f /tmp/rf2vc-ver.out
            BUMP=1 BUMP_KIND="${BUMP_KIND}" SHA="${SHA}" \
              ./scripts/ci/resolve-version.sh | tee /tmp/rf2vc-ver.out
            SEMVER="$(awk -F= '/^semver=/{print $2}' /tmp/rf2vc-ver.out | tail -1)"
            GIT_TAG="$(awk -F= '/^git_tag=/{print $2}' /tmp/rf2vc-ver.out | tail -1)"
            VERSION_TAG="$(awk -F= '/^version_tag=/{print $2}' /tmp/rf2vc-ver.out | tail -1)"

            if git ls-remote --tags origin "refs/tags/${GIT_TAG}" | grep -q .; then
              echo "Tag ${GIT_TAG} already on origin (attempt ${attempt}); retry"
              continue
            fi

            git tag -f -a "${GIT_TAG}" -m "rf2vc ${GIT_TAG} (${VERSION_TAG})"
            if git push origin "refs/tags/${GIT_TAG}"; then
              claimed=1
              echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
              echo "git_tag=${GIT_TAG}" >> "$GITHUB_OUTPUT"
              echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
              echo "Claimed ${GIT_TAG} for ${VERSION_TAG}"
              break
            fi
            echo "Tag push raced (attempt ${attempt}); retry"
            git tag -d "${GIT_TAG}" 2>/dev/null || true
            sleep 1
          done

          if [ -z "${claimed}" ]; then
            echo "ERROR: could not claim a SemVer tag after retries"
            exit 1
          fi

  test:
    needs: prepare
    if: needs.prepare.outputs.version_tag != 'skip'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Go test
        run: go test ./...

  build-publish:
    needs: [prepare, test]
    if: needs.prepare.outputs.version_tag != 'skip'
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve GHCR token
        run: |
          set -euo pipefail
          # Always publish with GITHUB_TOKEN so the package is linked to this
          # public repository and inherits public visibility (anonymous pulls).
          token="${{ secrets.GITHUB_TOKEN }}"
          if [ -z "${token}" ]; then
            echo "ERROR: GITHUB_TOKEN unavailable"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "GHCR_TOKEN=${token}" >> "$GITHUB_ENV"
          echo "GHCR_USER=${{ github.actor }}" >> "$GITHUB_ENV"

      - name: Build and push image
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          SEMVER: ${{ needs.prepare.outputs.semver }}
          GIT_TAG: ${{ needs.prepare.outputs.git_tag }}
          IS_PROD: ${{ needs.prepare.outputs.is_prod }}
        run: |
          set -euo pipefail
          # Always: immutable build id  →  vX.Y.Z-<sha>
          # On main: also floating      →  vX.Y.Z  and  latest
          REPO="ghcr.io/dasmlab/rf2vc"
          IMAGE_SHA="${REPO}:${VERSION_TAG}"
          IMAGE_SEMVER="${REPO}:${GIT_TAG}"
          IMAGE_PLAIN="${REPO}:${SEMVER}"
          IMAGE_LATEST="${REPO}:latest"

          TAG_ARGS=(-t "${IMAGE_SHA}")
          if [ "${IS_PROD}" = "true" ]; then
            TAG_ARGS+=(-t "${IMAGE_SEMVER}" -t "${IMAGE_PLAIN}" -t "${IMAGE_LATEST}")
          fi

          if command -v buildah >/dev/null 2>&1; then
            buildah bud \
              --build-arg BUILD_VERSION="${VERSION_TAG}" \
              -f deployments/containers/Containerfile \
              "${TAG_ARGS[@]}" .
            echo "${GHCR_TOKEN}" | buildah login -u "${GHCR_USER}" --password-stdin ghcr.io
            buildah push "${IMAGE_SHA}"
            if [ "${IS_PROD}" = "true" ]; then
              buildah push "${IMAGE_SEMVER}"
              buildah push "${IMAGE_PLAIN}"
              buildah push "${IMAGE_LATEST}"
            fi
          else
            docker build \
              --build-arg BUILD_VERSION="${VERSION_TAG}" \
              -f deployments/containers/Containerfile \
              "${TAG_ARGS[@]}" .
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker push "${IMAGE_SHA}"
            if [ "${IS_PROD}" = "true" ]; then
              docker push "${IMAGE_SEMVER}"
              docker push "${IMAGE_PLAIN}"
              docker push "${IMAGE_LATEST}"
            fi
          fi
          echo "Published ${IMAGE_SHA}"
          if [ "${IS_PROD}" = "true" ]; then
            echo "Also: ${IMAGE_SEMVER} ${IMAGE_PLAIN} ${IMAGE_LATEST}"
          fi

      - name: Smoke test
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          cid="rf2vc-smoke-${GITHUB_SHA::8}"
          docker rm -f "${cid}" 2>/dev/null || true
          RUNNER=docker
          command -v docker >/dev/null 2>&1 || RUNNER=podman

          # Image runs as UID 65532 and expects -config. Avoid /etc bind mounts
          # (often invisible to rootless/SELinux on self-hosted); put smoke
          # config on the /data volume and override CMD.
          datadir="$(mktemp -d)"
          chmod 0777 "${datadir}"
          # Write config without Actions-YAML indentation (nested keys matter).
          printf '%s\n' \
            'listen: ":8080"' \
            'auth:' \
            '  username: "redfish"' \
            '  password: "smoke"' \
            'dataDir: "/data"' \
            'isoCacheDir: "/data/iso-cache"' \
            > "${datadir}/gateway.yaml"
          chmod 0644 "${datadir}/gateway.yaml"
          mkdir -p "${datadir}/iso-cache"
          chmod 0777 "${datadir}/iso-cache"

          ${RUNNER} pull "ghcr.io/dasmlab/rf2vc:${VERSION_TAG}"
          ${RUNNER} run -d --name "${cid}" \
            -v "${datadir}:/data:Z" \
            "ghcr.io/dasmlab/rf2vc:${VERSION_TAG}" \
            -config /data/gateway.yaml
          trap '${RUNNER} rm -f "${cid}" 2>/dev/null || true; rm -rf "${datadir}"' EXIT

          for _ in $(seq 1 30); do
            if ${RUNNER} exec "${cid}" curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              ${RUNNER} exec "${cid}" curl -fsS -u redfish:smoke http://localhost:8080/api/v1/status
              ${RUNNER} exec "${cid}" curl -fsS -u redfish:smoke http://localhost:8080/redfish/v1/
              exit 0
            fi
            # Surface boot errors early (missing config, bad yaml, etc.)
            if ! ${RUNNER} inspect -f '{{.State.Running}}' "${cid}" 2>/dev/null | grep -qi true; then
              echo "container exited early:"
              ${RUNNER} logs "${cid}" || true
              exit 1
            fi
            sleep 2
          done
          ${RUNNER} logs "${cid}" || true
          exit 1

  gitops-deploy:
    needs: [prepare, build-publish]
    if: success() && needs.prepare.outputs.is_prod == 'true'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Ensure prod HAProxy cert
        continue-on-error: true
        env:
          PREVIEW_PROXY_SSH_KEY: ${{ secrets.PREVIEW_PROXY_SSH_KEY }}
          PREVIEW_PROXY_HOST: "10.20.1.10"
          PREVIEW_PROXY_USER: "dasm"
        run: |
          chmod +x scripts/ci/ensure-prod-cert.sh
          bash scripts/ci/ensure-prod-cert.sh "rf2vc.apps.2026-prod-1.ocp.dasmlab.org"

      - name: GitOps sync
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          DEPLOY_TOKEN=""
          if [ -f "/home/dasm/gh_token" ]; then
            DEPLOY_TOKEN="$(tr -d '\n\r' < /home/dasm/gh_token)"
          fi
          if [ -z "${DEPLOY_TOKEN}" ]; then
            DEPLOY_TOKEN="${{ secrets.DASMLAB_GHCR_PAT }}"
          fi
          if [ -z "${DEPLOY_TOKEN}" ] && [ -f "/home/dasm/gh-pat" ]; then
            source /home/dasm/gh-pat
            DEPLOY_TOKEN="${DASMLAB_GHCR_PAT:-${GH_TOKEN:-}}"
          fi
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "ERROR: deploy token not set"
            exit 1
          fi

          git clone "https://x-access-token:${DEPLOY_TOKEN}@github.com/lmcdasm/dasmlab-live-cicd.git"
          TARGET_CLUSTERS=("2026-prod-1")

          for CLUSTER_NAME in "${TARGET_CLUSTERS[@]}"; do
            sed -e "s|__VERSION__|${VERSION_TAG}|g" \
              k8s_envelope/rf2vc_deploy-ocp.yaml > "generated-${CLUSTER_NAME}.yaml"
            DEPLOY_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/rf2vc/live"
            ARCHIVE_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/rf2vc/archived"
            mkdir -p "${DEPLOY_DIR}" "${ARCHIVE_DIR}"
            for old in "${DEPLOY_DIR}"/rf2vc-v*.yaml; do
              [ -e "${old}" ] && mv "${old}" "${ARCHIVE_DIR}/"
            done
            cp "generated-${CLUSTER_NAME}.yaml" "${DEPLOY_DIR}/rf2vc-${VERSION_TAG}.yaml"
          done

          cd dasmlab-live-cicd
          git config user.name "dasmlab-bot"
          git config user.email "ci@dasmlab.org"
          git add .
          if git diff --cached --quiet; then
            echo "No GitOps changes"
            exit 0
          fi
          git commit -m "Auto-publish rf2vc ${VERSION_TAG}"
          git push

  preview-deploy:
    needs: [prepare, build-publish]
    if: success() && needs.prepare.outputs.is_prod != 'true' && needs.prepare.outputs.version_tag != 'skip'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Deploy developer preview
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          PREVIEW_ACTOR: ${{ github.actor }}
          PREVIEW_PROXY_SSH_KEY: ${{ secrets.PREVIEW_PROXY_SSH_KEY }}
          PREVIEW_PROXY_HOST: "10.20.1.10"
          PREVIEW_PROXY_USER: "dasm"
          DASMLAB_GHCR_PAT: ${{ secrets.DASMLAB_GHCR_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_PROXY_SSH_KEY}" ]; then
            echo "ERROR: secret PREVIEW_PROXY_SSH_KEY is not set"
            exit 1
          fi
          chmod +x scripts/ci/*.sh
          ./scripts/ci/deploy-preview.sh
