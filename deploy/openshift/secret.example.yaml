# Copy to secret.yaml (do not commit real passwords) or create with:
#   oc -n rf2vc-system create secret generic rf2vc-gateway \
#     --from-literal=auth-username=redfish \
#     --from-literal=auth-password='CHANGE_ME'
apiVersion: v1
kind: Secret
metadata:
  name: rf2vc-gateway
  namespace: rf2vc-system
  labels:
    app: rf2vc
type: Opaque
stringData:
  auth-username: redfish
  auth-password: CHANGE_ME
