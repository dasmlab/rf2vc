apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rf2vc
  namespace: rf2vc-system
  labels:
    app: rf2vc
spec:
  # Leave host empty for OpenShift to assign *.apps.<cluster>; or set explicitly.
  to:
    kind: Service
    name: rf2vc
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
