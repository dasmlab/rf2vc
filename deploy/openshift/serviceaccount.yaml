apiVersion: v1
kind: ServiceAccount
metadata:
  name: rf2vc-sa
  namespace: rf2vc-system
---
# Optional: needed only if your cluster's restricted SCC blocks uid 65532.
# Safe to apply on most OpenShift clusters; no-op if already bound.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: rf2vc-sa
    namespace: rf2vc-system
