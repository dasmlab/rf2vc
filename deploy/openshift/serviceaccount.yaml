apiVersion: v1
kind: ServiceAccount
metadata:
  name: rf2vc-sa
  namespace: rf2vc-system
  annotations:
    # lets oauth-proxy use this SA as the OAuth client for the rf2vc Route
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"rf2vc"}}'
---
# Access = this Role. oauth-proxy checks it for dashboard users (--openshift-sar)
# and the gateway checks it for /api bearer tokens (:8444). Grant people via
# IdP groups in rf2vc-ui-access, systems via ServiceAccounts in rf2vc-api-clients.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rf2vc-ui-access
  namespace: rf2vc-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["rf2vc"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rf2vc-ui-access
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rf2vc-ui-access
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tdm-chips-admin
---
# System caller for /api: https://rf2vc.rf2vc-system.svc:8444 with this SA's token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rf2vc-api-client
  namespace: rf2vc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rf2vc-api-clients
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rf2vc-ui-access
subjects:
  - kind: ServiceAccount
    name: rf2vc-api-client
    namespace: rf2vc-system
---
# Optional: needed only if your cluster's restricted SCC blocks uid 65532.
# Safe to apply on most OpenShift clusters; no-op if already bound.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: rf2vc-sa
    namespace: rf2vc-system
