apiVersion: v1
kind: ServiceAccount
metadata:
  name: rf2vc-sa
  namespace: rf2vc-system
  annotations:
    # lets oauth-proxy use this SA as the OAuth client for the rf2vc Route
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"rf2vc"}}'
---
# Dashboard access = this Role. oauth-proxy checks it with --openshift-sar;
# add or remove IdP groups in the RoleBinding below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rf2vc-ui-access
  namespace: rf2vc-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["rf2vc"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rf2vc-ui-access
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rf2vc-ui-access
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tdm-chips-admin
---
# Optional: needed only if your cluster's restricted SCC blocks uid 65532.
# Safe to apply on most OpenShift clusters; no-op if already bound.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: rf2vc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: rf2vc-sa
    namespace: rf2vc-system
